name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # verify_all.py IS the gate: it re-derives the bishop-to-rook isomorphism
  # exhaustively, checks the fast counters against brute force, reproduces every
  # published OEIS term of every target indexed by its true offset, cross-checks
  # two independent algorithms, enforces the structural identities, and finally
  # runs pytest. Running it here means a push cannot quietly break a claim the
  # write-up makes.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python verify_all.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Pinned deliberately. Unpinned, this step installed whatever ruff was
      # newest that morning: 48d1bf1 linted clean on 0.15.16 and failed with 55
      # errors on 0.16.1 without a line of the repo changing. The rule set now
      # lives in ruff.toml and the version that grades it is fixed here, so a red
      # lint means the code changed. Bump both together, never just this line.
      - run: pip install ruff==0.16.1
      - run: ruff check .

  # The gitleaks binary directly rather than gitleaks-action, and the whole
  # history rather than a diff. The action scans only the range
  # <before>^..<after> that a push touched, so a secret committed earlier and
  # never edited again is never looked at; and on a repository's first push the
  # parent of the root commit does not exist, so it fails outright.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
